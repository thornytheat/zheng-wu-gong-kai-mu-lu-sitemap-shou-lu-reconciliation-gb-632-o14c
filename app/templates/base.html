<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}政务公开目录与收录对账{% endblock %}</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/layout.css">
<link rel="stylesheet" href="/static/components.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="seal" aria-hidden="true">档</span>
      <span class="org">河州市政务公开办 · 网站编辑部</span>
    </div>
    <dl class="runmeta">
      <div><dt>批次号</dt><dd>{{ run.run_id if run else "—" }}</dd></div>
      <div><dt>数据版本</dt><dd>{{ eval_date }}</dd></div>
      <div><dt>规则版本</dt><dd>{{ rule_version }}</dd></div>
    </dl>
  </header>

  <nav class="crumbs" aria-label="位置">
    <span>首页</span><span class="sep">/</span>
    <a href="/">目录对账</a><span class="sep">/</span>
    <span class="here">{{ page_label or "巡检运行" }}</span>
  </nav>

  <nav class="tabs" aria-label="栏目">
    {% for href, label, key in nav %}
    <a href="{{ href }}" class="{{ 'on' if key == active else '' }}">{{ label }}</a>
    {% endfor %}
  </nav>

  <main class="main">
    {% block body %}{% endblock %}
  </main>

  <footer class="sign">
    <span>制表：网站编辑部</span>
    <span>审核：______</span>
    <span>日期：{{ eval_date }}</span>
  </footer>
</div>
<script src="/static/app.js" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
